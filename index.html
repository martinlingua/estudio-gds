<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión del Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior con marca y pestañas; contenido a ancho de trabajo; tablas anchas con scroll propio. */
:root{
  --bg:#f3f3f0; --surface:#ffffff; --ink:#141414; --muted:#6a6a64; --line:#dcdcd5; --stone:#c9c9c4; --wash:#ecece7;
  --btn:#141414; --btn-ink:#ffffff; --ok:#2c6e4d; --warn:#9a6200; --bad:#b1352a; --info:#2b5b88;
  --ok-bg:#e3f0e8; --warn-bg:#f8ecd2; --bad-bg:#f7e0dd; --info-bg:#dfe9f3;
  --f-display:'Jost','Century Gothic','Futura',sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101010; --surface:#191918; --ink:#efefea; --muted:#9b9b94; --line:#2f2f2c; --stone:#4a4a46; --wash:#222220;
  --btn:#efefea; --btn-ink:#141414; --ok:#6cc596; --warn:#e2b04f; --bad:#f08a7e; --info:#8db8e4;
  --ok-bg:#1a2c22; --warn-bg:#33290f; --bad-bg:#3a1c18; --info-bg:#16283a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101010; --surface:#191918; --ink:#efefea; --muted:#9b9b94; --line:#2f2f2c; --stone:#4a4a46; --wash:#222220;
  --btn:#efefea; --btn-ink:#141414; --ok:#6cc596; --warn:#e2b04f; --bad:#f08a7e; --info:#8db8e4;
  --ok-bg:#1a2c22; --warn-bg:#33290f; --bad-bg:#3a1c18; --info-bg:#16283a; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px}h2{font-size:19px}h3{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
.num,.cell,input[inputmode]{font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:42px;width:auto;display:block}
.brand b{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase;line-height:1.15}
.brand small{display:block;color:var(--muted);font-family:var(--f-body);letter-spacing:.04em;text-transform:none;font-size:12px;font-weight:400}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-size:15px;letter-spacing:.04em;border-bottom:2px solid transparent;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
nav button:hover{color:var(--ink)}
.top-r{margin-left:auto;display:flex;gap:8px}
main{max-width:1320px;margin:0 auto;padding:22px 16px 60px}

.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar .sp{flex:1}
.btn{background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn);padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--stone)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.panel + .panel{margin-top:14px}
.grid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid.w2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px;color:var(--muted);letter-spacing:.03em}
label.f>span.h{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
input[type=text],input[type=date],input[type=email],input[type=password],input:not([type]),input[type=number],select,textarea{background:var(--surface);border:1px solid var(--stone);border-radius:4px;padding:7px 9px;color:var(--ink);min-width:0;width:100%;font-size:14px}
textarea{resize:vertical;min-height:70px}
input:disabled{background:var(--wash);color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:var(--wash);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.clk{cursor:pointer}tbody tr.clk:hover td{background:var(--wash)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;background:var(--wash);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}
.muted{color:var(--muted)}.small{font-size:12px}
.note{padding:9px 12px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.note.info{background:var(--info-bg);color:var(--info)}
.note + .note,.panel .note{margin-top:8px}

/* editor de presupuesto */
.ed{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
@media(max-width:1000px){.ed{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px;min-width:0;grid-template-columns:minmax(0,1fr)}
.stack>*{min-width:0}
.sumbar{display:flex;gap:8px 32px;flex-wrap:wrap;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 16px;margin-bottom:14px;z-index:10}
.sumbar .sb{display:flex;gap:10px;align-items:baseline}
@media(min-width:760px){.sumbar{position:sticky;top:64px}}
@media(max-width:1000px){.sum{position:static}}
.big{font-family:var(--f-display);font-size:26px;font-weight:500}
.sumrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
input.cell{width:104px;text-align:right;padding:5px 7px;font-size:13px}
input.cell.ov{font-weight:600;border-color:var(--info);background:var(--info-bg)}
input.cell.auto{color:var(--muted)}
input.mini{width:74px;text-align:right;padding:5px 7px;font-size:13px}
input.mid{width:104px;text-align:right;padding:5px 7px;font-size:13px}
tr.off td{opacity:.45}tr.off td:first-child,tr.off td:nth-child(2){opacity:1}
.ut{display:grid;gap:10px}
.unit{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(120px,1fr) minmax(120px,1fr) 120px auto;gap:10px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:4px}
@media(max-width:760px){.unit{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--stone);background:transparent;border-radius:99px;padding:5px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

/* tablero */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--wash);border-radius:6px;padding:10px;min-height:120px}
.col h3{display:flex;justify-content:space-between;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--ink)}
.card .t{font-weight:500;margin-bottom:4px}
.prog{height:4px;background:var(--wash);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}
.chk input{width:auto}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:9px 16px;border-radius:4px;z-index:60;max-width:90vw}

/* documento para el cliente */
.doc{background:#fff;color:#141414;max-width:820px;margin:0 auto;padding:36px 44px;border:1px solid var(--line);font-family:var(--f-body)}
.doc h2{font-size:22px;letter-spacing:.2em;text-transform:uppercase;text-align:center;margin:18px 0 4px}
.doc .hd{display:flex;align-items:center;gap:20px;border-bottom:2px solid #141414;padding-bottom:14px}
.doc .hd img{height:84px;width:auto}
.doc .hd .nm{font-family:var(--f-display);letter-spacing:.16em;text-transform:uppercase;font-size:17px;line-height:1.3}
.doc .hd .nm small{display:block;letter-spacing:.14em;color:#6a6a64;font-size:11.5px}
td.rule{white-space:nowrap}
td.rule .small{white-space:normal}
.doc .hd .id{margin-left:auto;text-align:right;font-size:13px}
.doc table{margin:8px 0 0}
.doc th{background:#efefea;color:#3a3a37}
.doc td,.doc th{border-color:#d8d8d2;color:#141414}
.doc .tot td{font-weight:600;border-top:2px solid #141414;font-size:15px}
.doc h3{color:#141414;margin-top:22px;font-size:14px;border-bottom:1px solid #141414;padding-bottom:4px}
.doc .fine{font-size:11.5px;color:#4a4a45;margin-top:22px;border-top:1px solid #d8d8d2;padding-top:10px;text-transform:uppercase;letter-spacing:.03em}
@media(max-width:700px){.doc{padding:20px 16px}.doc .hd{flex-wrap:wrap}}
@media print{
  :root{color-scheme:light}
  body{background:#fff}.top,.noprint,.toast{display:none!important}
  main{padding:0;max-width:none}.doc{border:0;padding:0;max-width:none}
}
</style>
</head>

const roundUp = (n, m) => (!m || m <= 1) ? n : Math.ceil(n / m - 1e-9) * m;
const clamp = (n, a, b) => Math.min(Math.max(n, a), b);

function honTarifa(q) {
  const P = q.params, key = q.acto === 'hipoteca' ? 'hipoteca' : q.acto;
  const t = Object.assign({pct: 0, min: 0}, P.honActo[key] || {});
  if (q.acto === 'compraventa') {
    if (P.cliHonPct != null) t.pct = P.cliHonPct;
    if (P.cliHonMin != null) t.min = P.cliHonMin;
  }
  return t;
}

function aporteUnit(q, u, m) { // m = {monto, imp}
  const P = q.params, a = ACTOS[q.acto].aporte;
  let v = 0;
  if (a === 'general') v = clamp(P.aportePct / 100 * m.imp, P.aporteMin, P.aporteMax);
  else if (a === 'particion') v = clamp(P.aporteParticionPct / 100 * m.imp, P.aporteMin, P.aporteMax);
  else if (a === 'cesion') v = clamp(P.aporteCesionPct / 100 * m.monto, P.aporteMin, P.aporteMax);
  else if (a === 'sociedad') v = clamp(P.aporteSociedadPct / 100 * m.monto, P.aporteMin, P.aporteMax);
  else if (a === 'cancel') v = clamp(Math.max(P.aporteCancelFijo + P.aporteCancelPct / 100 * m.monto, P.aporteCancelMin), 0, P.aporteMax);
  else if (a === 'ph') v = u.tipo === 'cochera' ? P.aportePhCochera : P.aportePhUnidad;
  else if (a === 'fijo') v = (P.aporteFijos[q.fijoSel] || ['', 0])[1];
  else if (a === 'poder') {
    const po = q.poder || {tipo: 'esp', asuntos: 1, otorgantes: 1, modif: false};
    const pp = P.aportePoder;
    v = pp[po.tipo] || 0;
    if (po.tipo === 'esp') v += Math.max(0, (+po.asuntos || 1) - 1) * pp.espOtro;
    if (po.modif) v *= 0.5;
    v *= 1 + 0.5 * Math.max(0, (+po.otorgantes || 1) - 1);
  }
  return v;
}

function computeQuote(q) {
  const P = q.params, acto = ACTOS[q.acto];
  const tc = q.moneda === 'USD' ? (+q.tc || 0) : 1;
  const mult = t => t === 'rural' ? P.multRural : P.multUrbano;
  const units = q.unidades.map(u => {
    const monto = (+u.monto || 0) * tc;
    const av = (+u.avaluo || 0) * mult(u.tipo);
    return {monto, av, imp: Math.max(monto, av)};
  });
  const rows = [];
  const hon = honTarifa(q);
  const desc = (+P.cliDescHon || 0) / 100;
  const roundM = +q.redondeo || 0;
  const muni = (P.muni || DEFAULT_PARAMS.muni)[q.municipio];
  const muniVal = muni ? ((q.acto === 'hipoteca' && muni[1] != null) ? muni[1] : muni[0]) : 0;
  const cfgOf = k => q.cfg[k] || {on: false};

  const calcCell = (s, cfg, u, i) => {
    let v = 0;
    switch (s.kind) {
      case 'pct': v = (cfg.pct || 0) / 100 * (s.base === 'monto' ? u.monto : u.imp); break;
      case 'pctfijo': v = (cfg.pct || 0) / 100 * u.imp + (cfg.val || 0); break;
      case 'fijo': v = cfg.val || 0; break;
      case 'muni': v = cfg.val != null && cfg.val !== '' ? cfg.val : muniVal; break;
      case 'aporte': v = aporteUnit(q, q.unidades[i], u); break;
      case 'llanas': v = (cfg.qty || 0) * (cfg.val || 0); break;
      case 'hon': v = Math.max((cfg.pct || 0) / 100 * u.monto, cfg.min || 0) * (1 - desc); break;
      case 'qty': v = (cfg.qty || 0) * (cfg.val || 0); break;
    }
    return v;
  };

  const lineTotals = {};
  acto.lines.forEach(k => {
    const s = SPEC[k], cfg = cfgOf(k);
    const cells = units.map((u, i) => {
      let auto = 0;
      if (cfg.on) {
        if (s.once && i > 0) auto = 0;
        else if (s.kind === 'pcthon') auto = (cfg.pct || 0) / 100 * (lineTotals.honorarios || 0);
        else auto = calcCell(s, cfg, u, i);
        auto = roundUp(auto, roundM);
      }
      const ov = q.unidades[i].ov && q.unidades[i].ov[k];
      const has = ov != null && ov !== '';
      return {auto, val: cfg.on ? (has ? +ov : auto) : 0, ov: has};
    });
    const total = cells.reduce((a, c) => a + c.val, 0);
    lineTotals[k] = total;
    const pv = clamp(+cfg.pv || 0, 0, 100);
    rows.push({k, label: s.label, on: !!cfg.on, cells, total, vend: total * pv / 100, comp: total * (100 - pv) / 100, pv});
  });

  // Hipoteca simultánea (regla 11 de la cartilla: el acto menor aporta 50%)
  let hip = null;
  if (q.acto === 'compraventa' && q.simult && q.simult.on) {
    const hm = (+q.simult.monto || 0) * tc;
    const cfg = q.simult;
    let ap = clamp(P.aportePct / 100 * hm, P.aporteMin, P.aporteMax);
    const apCompra = (rows.find(r => r.k === 'aportes') || {total: 0}).total;
    if (cfg.regla11 !== false) ap = ap * 0.5;
    const h = Math.max(((cfg.honPct != null ? cfg.honPct : P.honActo.hipSimult.pct) / 100) * hm, P.honActo.hipSimult.min || 0) * (1 - desc);
    const st = (cfg.sellosPct != null ? cfg.sellosPct : P.sellosHipPct) / 100 * hm;
    const items = [['Hipoteca simultánea: aportes', roundUp(ap, roundM)], ['Hipoteca simultánea: honorarios', roundUp(h, roundM)], ['Hipoteca simultánea: sellos', roundUp(st, roundM)]];
    hip = items.filter(x => x[1] > 0).map(x => ({label: x[0], total: x[1], vend: 0, comp: x[1], pv: 0}));
    void apCompra;
  }
  const custom = (q.custom || []).map(c => {
    const t = +c.monto || 0, pv = clamp(+c.pv || 0, 0, 100);
    return {label: c.label || 'Otro concepto', total: t, vend: t * pv / 100, comp: t * (100 - pv) / 100, pv};
  });

  const all = rows.filter(r => r.on).concat(hip || [], custom);
  const totV = all.reduce((a, r) => a + r.vend, 0), totC = all.reduce((a, r) => a + r.comp, 0);
  const warnings = [];
  if (acto.lines.includes('honorarios') && cfgOf('honorarios').on && hon.pct === 0 && hon.min === 0 && !(cfgOf('honorarios').pct || cfgOf('honorarios').min))
    warnings.push('Este acto no tiene tarifa de honorarios cargada. Completala en la fila Honorarios o en Tarifas.');
  if (q.moneda === 'USD' && !tc) warnings.push('Falta la cotización del dólar.');
  return {units, rows, hip: hip || [], custom, totV, totC, total: totV + totC, warnings, tc};
}

function initCfg(q, keepFrom) {
  const P = q.params, hon = honTarifa(q), cfg = {};
  LINE_SPECS.forEach(s => {
    const c = {on: s.on, pv: s.pv};
    if (s.pctKey) c.pct = P[s.pctKey];
    if (s.k === 'derechos' || s.k === 'estudio') c.val = Math.round(P.honMin * P.fijoCertPctMin) / 100;
    if (s.valKey) c.val = P[s.valKey];
    if (s.k === 'aysam') c.val = q.persona === 'sociedad' ? P.aysamSoc : P.aysamPart;
    if (s.k === 'transfMun') c.val = '';
    if (s.k === 'llanas') { c.qty = P.hojasDefault; c.val = P.honMin * P.llanaPctMin / 100; }
    if (s.kind === 'qty') { c.qty = 0; c.val = P.honMin * P[s.pctMinKey] / 100; }
    if (s.k === 'honorarios') { c.pct = hon.pct; c.min = hon.min; }
    if (s.k === 'estudio' && P.cliCobraEstudio === false) c.on = false;
    if (s.k === 'derechos' && P.cliCobraDerechos === false) c.on = false;
    if (P.cliTodoComprador && s.pv > 0) c.pv = 0;
    if (keepFrom && keepFrom[s.k]) { c.on = keepFrom[s.k].on; c.pv = keepFrom[s.k].pv; if (c.qty != null && keepFrom[s.k].qty != null) c.qty = keepFrom[s.k].qty; }
    cfg[s.k] = c;
  });
  return cfg;
}

}
function load() {

}
function save() { if (Cloud.on) { cloudSchedule(); return; } try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { if (!memOnly) { memOnly = true; toast('Este navegador no permite guardar. Exportá una copia desde Tarifas.'); } } }

function newQuote(clienteId, acto) {
  const cli = S.clientes.find(c => c.id === clienteId);
  const params = clone(S.params);
  if (cli) {
    params.cliHonPct = cli.honPct; params.cliHonMin = cli.honMin; params.cliDescHon = cli.descHon;

    params.cliCobraEstudio = cli.cobraEstudio; params.cliCobraDerechos = cli.cobraDerechos; params.cliTodoComprador = cli.todoComprador;
  }
  const q = {id: uid(), num: null, fecha: today(), estado: 'Borrador', clienteId: clienteId || '', clienteNombre: cli ? cli.nombre : '', ref: '', acto: acto || 'compraventa',

    fijoSel: 'rectif', simult: {on: false, monto: 0, regla11: true}, params, unidades: [{nombre: 'Inmueble', monto: 0, avaluo: 0, tipo: 'urbano', ov: {}}], custom: [], notas: '', mostrar: 'ambos'};
  q.cfg = initCfg(q, null);

}

  $('#nav').innerHTML = NAV.map(([k, l]) => `<button type="button" data-nav="${k}" ${view.name.startsWith(k) || (k === 'presupuestos' && ['editor', 'doc'].includes(view.name)) ? 'aria-current="page"' : ''}>${l}</button>`).join('');

function recalc() {
  const q = getQ(view.id); if (!q || view.name !== 'editor') return;
  const r = computeQuote(q), P = q.params;
  r.rows.forEach(row => {
    const tr = $('#r_' + row.k); if (tr) tr.classList.toggle('off', !row.on);
    row.cells.forEach((c, i) => {
      const el = $(`[data-cell="${row.k}|${i}"]`); if (!el) return;
      el.className = 'cell ' + (c.ov ? 'ov' : (row.on ? 'auto' : 'auto'));
      if (document.activeElement !== el) el.value = row.on || c.ov ? fnum(Math.round(c.val)) : '';
      el.disabled = !row.on;
      if (!c.ov) el.title = 'Cálculo automático';
    });
    const t = $('#t_' + row.k); if (t) t.innerHTML = row.on ? `${money(row.total)}<div class="muted small">C ${money(row.comp)} · V ${money(row.vend)}</div>` : '—';
  });
  const ar = $('#aruleTxt'); if (ar) ar.textContent = q.acto === 'general' || ['compraventa', 'hipoteca', 'donacion', 'permuta'].includes(q.acto) ? `${nf2.format(P.aportePct)}% · mín ${money(P.aporteMin)}` : 'según cartilla';
  r.units.forEach((u, i) => { const el = $('#ub' + i); if (el) el.textContent = ['compraventa', 'hipoteca', 'donacion', 'permuta', 'particion'].includes(q.acto) ? `Base imponible ${money(u.imp)}${u.av > u.monto ? ' (rige el ' + (q.unidades[i].tipo === 'rural' ? 'cuádruple' : 'triple') + ' del avalúo fiscal)' : ''}` : (u.monto ? `Monto en pesos ${money(u.monto)}` : ''); });
  $('#s_c').textContent = money(r.totC); $('#s_v').textContent = money(r.totV); $('#s_t').textContent = money(r.total);
  $('#s_u').textContent = 'USD ' + nf0.format(S.params.tcVenta ? r.total / S.params.tcVenta : 0);
  $('#warns').innerHTML = r.warnings.map(w => `<div class="note">${esc(w)}</div>`).join('');
}

  }

}

/* ===== Nube: Supabase (correo y contraseña + Postgres con RLS + tiempo real) ===== */
const CLOUD_COLLS = ['clientes', 'presupuestos', 'tareas'];
const canon = o => Array.isArray(o) ? '[' + o.map(canon).join(',') + ']' : (o && typeof o === 'object') ? '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + canon(o[k])).join(',') + '}' : JSON.stringify(o === undefined ? null : o);
const cleanDoc = o => { const c = JSON.parse(JSON.stringify(o)); delete c.id; return c; };
function blankState() { return {v: 1, params: clone(DEFAULT_PARAMS), clientes: [], presupuestos: [], tareas: [], equipo: ['Escribana', 'Procuración', 'Administración'], seq: 0, ejemplo: false}; }
function mergeParams(d) {
  const m = clone(DEFAULT_PARAMS);
  Object.keys(d || {}).forEach(k => { if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && m[k] && typeof m[k] === 'object') m[k] = Object.assign(m[k], d[k]); else m[k] = d[k]; });
  return m;
}
function mergeImport(j) {
  const r = {clientes: 0, presupuestos: 0, tareas: 0, omitidas: 0};
  CLOUD_COLLS.forEach(c => (j[c] || []).forEach(item => {
    if (c === 'tareas' && item.ejemplo) { r.omitidas++; return; }
    if (!item.id) item.id = uid();
    const i = S[c].findIndex(x => x.id === item.id);
    if (i >= 0) S[c][i] = item; else S[c].push(item);
    r[c]++;
  }));
  if (j.params) S.params = mergeParams(j.params);
  if (j.equipo && j.equipo.length) S.equipo = j.equipo;
  S.seq = Math.max(S.seq || 0, j.seq || 0, ...S.presupuestos.map(q => q.num || 0));
  sortColls();
  return r;
}
function sortColls() {
  S.presupuestos.sort((a, b) => (b.num || 0) - (a.num || 0));
  S.tareas.sort((a, b) => (b.creada || '').localeCompare(a.creada || '') || (a.id < b.id ? -1 : 1));
  S.clientes.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));
}
const editingNow = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#app')); };
function afterSnapshot() { updateChrome(); if (editingNow()) { Cloud.pendingRender = true; return; } render(true); }

function cloudSchedule() { if (!Cloud.ready) return; setSync('saving'); clearTimeout(Cloud.timer); Cloud.timer = setTimeout(() => { Cloud.timer = null; cloudFlush(); }, 450); }
async function cloudFlush() {

    const sets = [], dels = {};

    try {
      const rows = sets.map(o => ({coleccion: o.c, id: o.id, data: o.d}));
      if (appChanged) rows.push({coleccion: 'config', id: 'app', data: JSON.parse(JSON.stringify(ad))});

    if (d.chk != null && d.chk !== '') { t.checklist[+d.chk].done = el.checked; delete t.ejemplo; save(); return render(); }
  }
  if (view.name === 'clientes' && d.cf) {
    const c = S.clientes.find(x => x.id === view.cid); const f = d.cf;
    if (['honPct', 'honMin', 'descHon', 'derechosPct', 'estudioPct'].includes(f)) { c[f] = num(); el.value = fnum(c[f]); }
    else if (['cobraEstudio', 'cobraDerechos'].includes(f)) c[f] = el.value === '1';
    else if (f === 'todoComprador') c[f] = el.value === '1';
    else c[f] = el.value;
    save(); if (f === 'nombre') { const r = document.querySelector(`tr[data-cli="${c.id}"] td`); if (r) r.textContent = c.nombre; const h = document.querySelector('.panel h3'); if (h) h.textContent = c.nombre; } return;
  }
  if (view.name === 'tarifas') {
    if (d.pp) { const v = num() ?? 0; setPath(S.params, d.pp, v); el.value = fnum(v); save(); return; }
    if (d.mu) { const [n, i] = d.mu.split('|'); const v = num() ?? 0; S.params.muni[n][+i] = v; el.value = fnum(v); save(); return; }
  }
});

document.addEventListener('DOMContentLoaded', () => {});
$('#themeBtn').addEventListener('click', () => {
  const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  r.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(KEY + '-theme', r.dataset.theme); } catch (e) {}
});
try { const th = localStorage.getItem(KEY + '-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

document.addEventListener('submit', ev => {
  const f = ev.target.closest && ev.target.closest('[data-form="login"]'); if (!f) return;
  ev.preventDefault(); const em = $('#lgEmail').value.trim(); Cloud.lastEmail = em; cloudLogin(em, $('#lgPw').value);
});
const cfg = window.SUPABASE_CONFIG;
const badHost = !!(cfg && cfg.url) && /(^|\.)supabase\.com$/.test((() => { try { return new URL(String(cfg.url).trim()).hostname; } catch (x) { return ''; } })());
if (cfg && cfg.url && (badHost || !cfg.anonKey || !window.supabase)) { $('#app').innerHTML = `<div class="panel" style="max-width:520px;margin:60px auto"><h2>No se pudo conectar con Supabase</h2><p class="muted">${badHost ? 'La dirección que pegaste en supabase-config.js es la del panel. Tiene que ser la Project URL, con la forma https://xxxxxxxx.supabase.co' : !cfg.anonKey ? 'Falta la clave anon en supabase-config.js.' : 'Revisá tu conexión a internet y recargá la página.'}</p></div>`; }
else if (cfg && cfg.url) cloudInit();
else { load(); if (S.params && !S.params.muni) S.params.muni = clone(DEFAULT_PARAMS.muni); render(); }

</script>
</body>
